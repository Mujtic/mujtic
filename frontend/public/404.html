  <script>

  <style>

      mask: radial-gradient(circle 16px at calc(100% - 230px) 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 16px at calc(100% - 230px) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;

    .num svg { width: .8em; height: .8em; overflow: visible; }
    .tile { fill: var(--teal); } .ring { stroke: var(--on-teal); transform-origin: 60px 60px; animation: spin 16s linear infinite; }
    .st path { fill: var(--on-teal); } .st.mid path { fill: var(--coral); stroke: var(--on-teal); stroke-width: 1.1; } .mk path { fill: var(--on-teal); }
    h1 { font: 700 1.5rem 'Syne', sans-serif; color: var(--bright); margin-bottom: .6rem; }
    p { max-width: 440px; font-size: .95rem; color: var(--dim); }
    .btns { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.6rem; }
    .btn { display: inline-flex; align-items: center; padding: .7rem 1.4rem; border-radius: 8px; font: 600 .9rem 'Outfit', sans-serif; text-decoration: none; cursor: pointer; transition: all .2s var(--ease); border: 1px solid transparent; }
    .btn-primary { background: var(--teal); color: var(--on-teal); } .btn-primary:hover { background: var(--teal-d); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--bright); border-color: var(--border-2); } .btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
    .stub { position: relative; border-left: 2px dashed var(--border-2); display: flex; align-items: center; justify-content: center; background: var(--teal-glow); }
    .stub span { writing-mode: vertical-rl; transform: rotate(180deg); font: 500 .72rem 'JetBrains Mono', monospace; letter-spacing: .32em; text-transform: uppercase; color: var(--teal); white-space: nowrap; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      .top { padding: 1.1rem 1.25rem; }
      .ticket { grid-template-columns: 1fr; -webkit-mask: none; mask: none; border: 1px solid var(--border); }
      .stub { display: none; } .main { padding: 2rem 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
</head>
